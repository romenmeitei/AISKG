[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiskg-framework"
version = "3.1.2"
description = "Unified AI-assisted ontology-guided semantic knowledge graph framework"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [
  {name = "Lourembam Romen Meitei"}
]
keywords = ["knowledge graph", "biomedical NLP", "ontology", "BERTopic", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "statsmodels>=0.14,<1",
  "networkx>=3.2,<4",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.1,<4",
  "PyYAML>=6,<7",
  "tabulate>=0.9,<1",
  "rapidfuzz>=3.6,<4",
  "requests>=2.31,<3",
  "biopython>=1.83,<2",
]

[project.optional-dependencies]
live = [
  "spacy>=3.7,<4",
  "sentence-transformers>=3,<6",
  "umap-learn>=0.5.5,<1",
  "hdbscan>=0.8.33,<1",
  "bertopic>=0.16,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/romenmeitei/AISKG"
Repository = "https://github.com/romenmeitei/AISKG"
Issues = "https://github.com/romenmeitei/AISKG/issues"

[project.scripts]
aiskg = "aiskg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: full frozen pipeline integration test",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["src/aiskg/legacy"]
