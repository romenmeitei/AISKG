name: AISKG continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check 

      - name: Unit tests
        run: pytest -q -m "not integration"

      - name: Complete frozen pipeline
        run: python run_pipeline.py --config configs/ci.yaml --run-id github-actions --clean --quiet

      - name: Verify generated release
        run: aiskg verify --run-dir outputs/github-actions

      - name: Check 285 reproducibility assertions
        run: |
          python - <<'PY'
          import pandas as pd
          audit = pd.read_csv("outputs/github-actions/outputs/reproducibility_audit.csv")
          assert len(audit) == 285, len(audit)
          assert set(audit["status"]) == {"PASS"}
          print("285/285 checks passed")
          PY

      - name: Upload deterministic release
        uses: actions/upload-artifact@v4
        with:
          name: AISKG-Framework-v3.0.0-release
          path: outputs/github-actions/AISKG_Framework_v3.0.0_Release.zip
          if-no-files-found: error
